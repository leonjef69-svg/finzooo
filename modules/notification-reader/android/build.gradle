apply plugin: 'com.android.library'

group = 'com.finzo.notificationreader'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

// El servicio que despierta a la app sin abrirla (FinzoCaptureService) usa
// HeadlessJsTaskService, que viene de React Native. Este modulo no lo tenia
// declarado —hasta ahora solo usaba cosas de Android y de Expo— y sin esta
// linea el modulo no compila.
dependencies {
  implementation "com.facebook.react:react-android"
}

android {
  namespace "com.finzo.notificationreader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
